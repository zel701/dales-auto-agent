[project]
name = "car-agent"
version = "0.1.0"
description = "LangGraph agent for car inventory search and dealership negotiation"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.3",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "resend>=2.0",
    "svix>=1.0",
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "langgraph-checkpoint-sqlite>=3.0",
]
prod = [
    "asyncpg>=0.30",
    "langgraph-checkpoint-postgres>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/car_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
